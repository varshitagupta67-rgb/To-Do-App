<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <div class="inputField">
            <input type="text" placeholder="Add your new task">
            <button>Add</button>
        </div>

        <ul class="todoList"></ul>

        <div class="footer">
            <span>
                You have
                <span class="pendingNumber">0</span>
                pending tasks
            </span>

            <button class="deleteAll">Clear All</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
